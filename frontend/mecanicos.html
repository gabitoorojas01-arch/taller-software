<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCitas Manager - Gestión de Mecánicos</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .mecanicos-container {
            background-color: #282c34;
            width: 100%;
            max-width: 850px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border-top: 5px solid #ff6b00;
        }
        .flex-gestion {
            display: flex;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .form-meco {
            flex: 1;
            min-width: 280px;
            background: #1e222b;
            padding: 20px;
            border-radius: 8px;
        }
        .tabla-meco {
            flex: 1.5;
            min-width: 320px;
        }
    </style>
</head>
<body>

    <div class="mecanicos-container">
        <!-- MENÚ DE NAVEGACIÓN INTEGRADO -->
        <nav style="margin-bottom: 25px; display: flex; gap: 20px; border-bottom: 1px solid #4f5666; padding-bottom: 15px;">
            <a href="admin.html" style="color: #ffffff; text-decoration: none; font-weight: bold; font-size: 16px;">📋 Panel de Citas</a>
            <a href="historial.html" style="color: #ffffff; text-decoration: none; font-weight: bold; font-size: 16px;">🔍 Historial por Placa</a>
            <a href="mecanicos.html" style="color: #ff6b00; text-decoration: none; font-weight: bold; font-size: 16px;">👨‍🔧 Personal Técnico</a>
        </nav>

        <h2>👨‍🔧 Gestión del Personal Técnico</h2>
        <p>Registra nuevos mecánicos al taller o consulta el estado del equipo actual.</p>

        <div class="flex-gestion">
            <!-- Formulario de Registro -->
            <div class="form-meco">
                <h3 style="color: #ff6b00; margin-bottom: 15px;">Agregar Técnico</h3>
                <form id="formRegistrarMecanico">
                    <div class="form-group">
                        <label for="nombreMeco">Nombre Completo:</label>
                        <input type="text" id="nombreMeco" placeholder="Ej. Andrés Torres" required>
                    </div>
                    <div class="form-group">
                        <label for="especialidadMeco">Especialidad Técnica:</label>
                        <input type="text" id="especialidadMeco" placeholder="Ej. Experto en Frenos y Suspensión" required>
                    </div>
                    <button type="submit" style="margin-top: 15px;">Guardar Técnico</button>
                </form>
            </div>

            <!-- Tabla de visualización de base de datos -->
            <div class="tabla-meco">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Especialidad</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tablaMecanicosCuerpo">
                        <!-- Se llena con JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="mecanicos.js"></script>
</body>
</html>
